trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

stages:

- stage: Build

  jobs:

  - job: CreateFile

    steps:

    - bash: |
        mkdir output
        echo "Hello Azure DevOps" > output/message.txt

    - publish: output
      artifact: MyArtifact

- stage: Deploy

  dependsOn: Build

  jobs:

  - job: DownloadFile

    steps:

    - download: current
      artifact: MyArtifact

    - bash: |
        echo "Files downloaded:"
        find .
