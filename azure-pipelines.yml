trigger:
- main

pr: none

pool:
  vmImage: ubuntu-latest

parameters:
- name: environment
  type: string
  default: dev
  values:
    - dev
    - test
    - prod

variables:
  tfVersion: '1.9.8'
  projectName: 'Terraform Azure Pipeline'
  environmentName: 'dev'

steps:
- bash: |
    echo "Step 1"
    exit 1
  displayName: Step 1 (Fail)

- bash: |
    echo "Step 2"
  displayName: Step 2

- bash: |
    echo "Cleanup"
  displayName: Cleanup
  condition: always()
- bash: |
    echo "Project      : $(projectName)"
    echo "Environment  : $(environmentName)"
    echo "TF Version   : $(terraformVersion)"
    echo "Branch       : $(Build.SourceBranch)"
    echo "Reason       : $(Build.Reason)"
    echo "Agent OS     : $(Agent.OS)"
    echo "===================================edhar dekho========================="
    echo "Environment  : ${{ parameters.environment }}"
  displayName: Explore Variables
- bash: |
    set -e

    cd /tmp

    sudo apt-get update
    sudo apt-get install -y wget unzip

    wget -q https://releases.hashicorp.com/terraform/$(tfVersion)/terraform_$(tfVersion)_linux_amd64.zip

    unzip -o terraform_1.9.8_linux_amd64.zip

    sudo install terraform /usr/local/bin/terraform

    terraform version

  displayName: Install Terraform
- bash: |
    cd terraform

    echo "========== Current Directory =========="
    pwd

    echo "=========tf-macro-variable==========="
    echo $(projectName)

    echo "========== Files =========="
    ls -la

    terraform init
  displayName: Terraform Init
- bash: |
    cd terraform

    echo "========== AFTER INIT =========="

    ls -la

    find . -maxdepth 2
  displayName: Explore Terraform Folder
- bash: |
    cd terraform
    terraform fmt

    terraform fmt -check
  displayName: Terraform Format Check
- bash: |
    echo "=============================fail ho gya========================================"
    echo "=============================fail hua isliye run hua============================"
  displayName: jabFailHuaTabRunHua
  condition: failed()
- bash: |
    echo "=====YE CHALEA HI CHALEGA = BO DEPENDENCIES ON ABOBE ONE========================"
  condition: succeededOrFailed()
  displayName: kisiNeMANUALLYbandKIYA
- bash: |
    echo "ye pipeline manually cancel hone pr chalega"
  conditionName: pipeLineCancel
  condition: canceled()
