trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

stages:

- stage: Validate
  jobs:
  - job: ValidateJob
    steps:
    - bash: |
        echo "Terraform Validate"

- stage: Plan
  dependsOn: Validate
  jobs:
  - job: PlanJob
    steps:
    - bash: |
        echo "Terraform Plan"

- stage: Apply
  dependsOn: Plan

  jobs:

  - deployment: ApplyDeployment
    environment: dev

    strategy:
      runOnce:
        deploy:
          steps:

          - bash: |
              echo "Deploying to DEV..."
