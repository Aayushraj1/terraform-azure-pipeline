trigger:
- main

pr: none

pool:
  vmImage: ubuntu-latest

steps:

- checkout: none

- script: |
    echo "Current Directory"
    pwd

    echo ""
    echo "Listing Current Directory"
    ls -la

    echo ""
    echo "Listing /home/vsts/work/1"
    ls -la /home/vsts/work/1

    echo ""
    echo "Try listing Sources folder"
    ls -la /home/vsts/work/1/s || echo "Sources folder doesn't exist"

    echo ""
    echo "Trying to access azure-pipelines.yml"
    cat azure-pipelines.yml || echo "File not found"
